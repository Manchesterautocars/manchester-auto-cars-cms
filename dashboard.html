<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Manchester Auto Cars CMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main">
    <header class="topbar">
      <div class="flex gap-12">
        <button class="hamburger" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div id="topbar-title"></div>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-primary" href="vehicle-edit.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          Add Vehicle
        </a>
      </div>
    </header>

    <div class="content">
      <div class="config-banner" id="config-banner"></div>

      <div class="grid grid-5 mb-16" id="stat-cards"></div>

      <div class="card mb-16">
        <div class="card-header"><h2>Recent Vehicles</h2><a class="btn btn-ghost btn-sm" href="vehicles.html">View all</a></div>
        <div id="recent-vehicles"></div>
      </div>

      <div class="card mb-16">
        <div class="card-header"><h2>Quick Actions</h2></div>
        <div class="quick-actions">
          <a class="quick-action" href="vehicle-edit.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
            <span>Add Vehicle</span>
          </a>
          <a class="quick-action" href="vehicles.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2.5" y="13" width="19" height="5.5" rx="1.5"/></svg>
            <span>View Vehicles</span>
          </a>
          <a class="quick-action" href="vehicles.html#publish">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 19H8a5 5 0 1 1 1.6-9.75A6 6 0 0 1 21 12.5a4 4 0 0 1-3.5 6.5z"/></svg>
            <span>Publish</span>
          </a>
          <a class="quick-action" href="vehicles.html#pull">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            <span>Pull Latest</span>
          </a>
          <a class="quick-action" href="settings.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
            <span>Settings</span>
          </a>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h2>Activity</h2></div>
        <div class="activity-list" id="activity-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
